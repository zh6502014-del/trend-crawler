name: bt-probe

# One-off: check how far back the price API and the monthly-revenue history go (needed for a valuation backtest).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          mkdir -p samples/bt
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, time
          def get(url, t=60):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req, timeout=t) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:300]
              except Exception as e:
                  return 0, repr(e).encode()
          out = {}
          key = os.environ.get("MASSIVE_API_KEY", "")
          for day in ["2025-10-31", "2024-10-31", "2023-10-31", "2022-10-31"]:
              c, raw = get(f"https://api.polygon.io/v2/aggs/grouped/locale/us/market/stocks/{day}?adjusted=true&apiKey={key}")
              try:
                  j = json.loads(raw)
                  out[f"us_{day}"] = {"http": c, "count": j.get("resultsCount"), "status": j.get("status"), "msg": str(j.get("message") or j.get("error") or "")[:160]}
              except Exception:
                  out[f"us_{day}"] = {"http": c, "head": raw[:160].decode("utf-8", "replace")}
              time.sleep(13)
          # monthly revenue history pages (static HTML on MOPS), ROC year / month
          for name, url in {
              "mops_sii_11409": "https://mopsov.twse.com.tw/nas/t21/sii/t21sc03_114_9_0.html",
              "mops_otc_11409": "https://mopsov.twse.com.tw/nas/t21/otc/t21sc03_114_9_0.html",
              "mops_sii_11309": "https://mops.twse.com.tw/nas/t21/sii/t21sc03_113_9_0.html",
              "mops_sii_11209": "https://mopsov.twse.com.tw/nas/t21/sii/t21sc03_112_9_0.html",
              "twse_openapi_rev_hist": "https://openapi.twse.com.tw/v1/opendata/t187ap05_L?year=114&month=9",
          }.items():
              c, raw = get(url)
              txt = raw.decode("big5", "replace") if name.startswith("mops") else raw.decode("utf-8", "replace")
              out[name] = {"http": c, "bytes": len(raw), "head": txt[:300], "has_2330": "2330" in txt, "rows": txt.count("<tr")}
          json.dump(out, open("samples/bt/probe.json", "w"), ensure_ascii=False, indent=1)
          print(json.dumps({k: {x: v[x] for x in v if x != "head"} for k, v in out.items()}, ensure_ascii=False))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/bt
          git commit -m "bt-probe: data depth samples" || echo none
          git pull --rebase -q || true
          git push
