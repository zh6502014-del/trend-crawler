name: checks

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: line_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - run: pip install -r crawler/requirements.txt pytest
      - run: node --test tests/*.test.mjs
      - run: python -m pytest -q
      - name: Verify migration, grants and atomic claims in PostgreSQL
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: test-only-password
          PGDATABASE: line_test
        run: |
          psql -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create role service_role bypassrls;'
          psql -v ON_ERROR_STOP=1 -f supabase/schema_line.sql
          psql -v ON_ERROR_STOP=1 -f supabase/schema_line.sql
          psql -v ON_ERROR_STOP=1 -f tests/line_schema.sql
