name: deploy-line-bot

# Deploys the LINE chat bot (Supabase Edge Function) whenever its code changes, or on demand.
# Needs repo secrets: SUPABASE_ACCESS_TOKEN, LINE_CHANNEL_SECRET, LINE_CHANNEL_TOKEN, LINE_USER_ID (and variable DASHBOARD_URL).
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/schema_line.sql", "scripts/apply_line_schema.py", "scripts/sync_line_menu.mjs", "scripts/check_line_login.mjs", "docs/line-auth.js", "docs/app.js", "docs/index.html", "docs/richmenu*.png", "crawler/digest.py", "crawler/run.py", ".github/workflows/deploy-line-bot.yml", ".github/workflows/checks.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: line-production-deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jxpnamaomzztqqahixvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply LINE schema before updating the function
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/apply_line_schema.py
      - name: Verify dashboard login before updating the function
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OWNER_UID: ${{ secrets.OWNER_UID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: node scripts/check_line_login.mjs
      - name: Set function secrets
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          OWNER_UID: ${{ secrets.OWNER_UID }}
          LINE_MONTHLY_CAP: ${{ vars.LINE_MONTHLY_CAP || '100' }}
          LINE_AI_ENABLED: ${{ vars.LINE_AI_ENABLED || '0' }}
          LINE_AI_DAILY_LIMIT: ${{ vars.LINE_AI_DAILY_LIMIT || '10' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          set -e
          for v in LINE_CHANNEL_SECRET LINE_CHANNEL_TOKEN LINE_USER_ID; do
            [ -n "${!v}" ] || { echo "missing secret $v"; exit 1; }
          done
          args=("LINE_CHANNEL_SECRET=$LINE_CHANNEL_SECRET" "LINE_CHANNEL_TOKEN=$LINE_CHANNEL_TOKEN" "LINE_USER_ID=$LINE_USER_ID")
          args+=("OWNER_UID=$OWNER_UID" "LINE_MONTHLY_CAP=$LINE_MONTHLY_CAP" "LINE_AI_ENABLED=$LINE_AI_ENABLED" "LINE_AI_DAILY_LIMIT=$LINE_AI_DAILY_LIMIT" "GEMINI_MODEL=$GEMINI_MODEL" "GEMINI_API_KEY=$GEMINI_API_KEY")
          [ -z "$DASHBOARD_URL" ] || args+=("DASHBOARD_URL=$DASHBOARD_URL")
          supabase secrets set "${args[@]}" --project-ref "$PROJECT_REF"
      - name: Deploy function without JWT check (LINE signs its own requests)
        run: |
          [ -f supabase/config.toml ] || supabase init
          supabase functions deploy line-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Synchronize and verify LINE rich menus
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: node scripts/sync_line_menu.mjs
