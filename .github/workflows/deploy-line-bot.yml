name: deploy-line-bot

# Deploys the LINE chat bot (Supabase Edge Function) whenever its code changes, or on demand.
# Needs repo secrets: SUPABASE_ACCESS_TOKEN, LINE_CHANNEL_SECRET, LINE_CHANNEL_TOKEN, LINE_USER_ID (and variable DASHBOARD_URL).
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jxpnamaomzztqqahixvp
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy function without JWT check (LINE signs its own requests)
        run: |
          [ -f supabase/config.toml ] || supabase init
          supabase functions deploy line-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Set function secrets
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          set -e
          for v in LINE_CHANNEL_SECRET LINE_CHANNEL_TOKEN LINE_USER_ID; do
            [ -n "${!v}" ] || { echo "missing secret $v"; exit 1; }
          done
          args=("LINE_CHANNEL_SECRET=$LINE_CHANNEL_SECRET" "LINE_CHANNEL_TOKEN=$LINE_CHANNEL_TOKEN" "LINE_USER_ID=$LINE_USER_ID")
          [ -z "$DASHBOARD_URL" ] || args+=("DASHBOARD_URL=$DASHBOARD_URL")
          supabase secrets set "${args[@]}" --project-ref "$PROJECT_REF"
