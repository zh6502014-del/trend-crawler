name: tw-crawl

# Taiwan market: TWSE closes 13:30 Taipei (05:30 UTC). Runs once a day after the close, weekdays.
# The first run back-fills ~150 trading days of prices (about 20 minutes); later runs add one day.
on:
  schedule:
    # Supabase pg_cron dispatches this workflow at 15:45 Taipei (from_cron=true). These GitHub schedules are late
    # backups (GitHub often starts them ~8 hours late); the guard skips them when the board is already in.
    - cron: "40 7 * * 1-5"    # 15:40 Taipei
    - cron: "10 10 * * 1-5"   # 18:10 Taipei
  workflow_dispatch:
    inputs:
      send_digest:
        description: "Send the Taiwan digest after crawling (leave off for deployment verification)"
        type: boolean
        default: false
      from_cron:
        description: "Set by the Supabase timer (pg_cron): guard against duplicates and send the digest"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: tw-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - run: pip install -r crawler/requirements.txt -r requirements-dev.txt
      - name: Skip if the latest Taiwan session's board is already in
        id: guard
        if: github.event_name == 'schedule' || inputs.from_cron
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m crawler.schedule_guard tw
      - if: steps.guard.outputs.skip != 'true'
        run: python -m pytest -q tests/test_tw.py tests/test_research.py tests/test_schedule_guard.py
      - name: Run Taiwan crawler
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m crawler.tw
      - name: Send Taiwan digest after a successful crawl
        if: steps.guard.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.from_cron || inputs.send_digest)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OWNER_UID: ${{ secrets.OWNER_UID }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_MONTHLY_CAP: ${{ vars.LINE_MONTHLY_CAP || '100' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          DIGEST_MARKET: tw
        run: python -m crawler.digest
      - name: Open or update a failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create crawler-failure --color B60205 --description "Daily crawl failed" 2>/dev/null || true
          existing=$(gh issue list --label crawler-failure --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Taiwan crawl failed again: $url"
          else
            gh issue create --title "Taiwan crawl failed" --label crawler-failure --body "Failed: $url"
          fi
