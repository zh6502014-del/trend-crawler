name: daily-crawl

on:
  schedule:
    # 21:30 UTC, Mon-Fri: after the US close in both summer (20:00 UTC) and winter (21:00 UTC) time.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      only:
        description: "Run one stage only: public, formc, smart, report or digest (blank = all)"
        required: false
        default: ""
      full_refresh:
        description: "Refresh all fundamentals now (slow, use for the first run)"
        type: boolean
        default: false

permissions:
  contents: write   # weekly heartbeat commit
  issues: write     # open an issue when the crawl fails

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - run: pip install -r crawler/requirements.txt

      - name: Verify crawler before using production credentials
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          OWNER_UID: ${{ secrets.OWNER_UID }}
          LINE_MONTHLY_CAP: ${{ vars.LINE_MONTHLY_CAP || '100' }}
          DIGEST_MARKET: us
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          PRICE_SOURCE: ${{ vars.PRICE_SOURCE || 'massive' }}
          ONLY: ${{ inputs.only }}
          FULL_REFRESH: ${{ inputs.full_refresh && '1' || '' }}
        run: python -m crawler.run

      # GitHub pauses scheduled workflows in a repo with no activity for 60 days.
      # One tiny commit a week keeps it alive. (Check GitHub's current docs: the rule may change.)
      - name: Weekly heartbeat commit
        if: success() && github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/heartbeat.txt
            git commit -m "chore: heartbeat" || true
            git push || true
          fi

      - name: Open or update a failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create crawler-failure --color B60205 --description "Daily crawl failed" 2>/dev/null || true
          existing=$(gh issue list --label crawler-failure --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $url"
          else
            gh issue create --label crawler-failure --title "趨勢爬蟲：排程失敗" \
              --body "The daily crawl failed or only partly succeeded. Logs: $url"
          fi
